<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Anhelo - Iniciar Sesión</title>
    <!-- Vinculación con el archivo CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Iconos para sobre, candado y ojo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Encabezado / Logo de la marca -->
        <header class="brand-header">
            <div class="logo-icon">
                <i class="fa-solid fa-cookie-bite"></i>
            </div>
            <h1 class="brand-title">Dulce Anhelo</h1>
            <p class="brand-subtitle">Repostería artesanal</p>
        </header>

        <!-- Tarjeta principal del formulario -->
        <main class="login-card">
            <h2 class="card-title">Iniciar Sesión</h2>
            <p class="card-subtitle">Bienvenido de nuevo — inicia sesión en tu cuenta</p>

            <form action="inicio.php" method="POST" class="login-form">
                
                <!-- Campo de Correo electrónico -->
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon-left"></i>
                        <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
                    </div>
                </div>

                <!-- Campo de Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon-left"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye input-icon-right" id="togglePassword"></i>
                    </div>
                </div>

                <!-- Botón de Inicio de Sesión -->
                <button type="submit" class="btn-primary">Iniciar Sesión</button>

            </form>
        </main>

        <!-- Sección de Registro -->
        <div class="register-section">
            <p>¿No tienes cuenta? Regístrate aquí</p>
            <a href="registro2.html" class="btn-secondary">Regístrate aquí</a>
        </div>

    </div>

</body>
</html>
